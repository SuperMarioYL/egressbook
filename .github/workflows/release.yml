name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test
        run: go test ./...
      - name: Build matrix
        run: |
          mkdir -p dist
          targets="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64"
          for t in $targets; do
            os=${t%/*}; arch=${t#*/}
            out="dist/egressbook_${os}_${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$out" ./cmd/egressbook
          done
          (cd dist && shasum -a 256 * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
